services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tabify-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=["*"]
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistent cache for downloaded TabPFN model weights (~100 MB)
      - tabpfn_cache:/root/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tabify-frontend
    ports:
      # Maps both 5173 (Vite default) and 80 (standard HTTP)
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tabpfn_cache:
    name: tabify_tabpfn_cache
